<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бизнес">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Бизнес-учёт</title>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; } * { box-sizing: border-box; }
button { background: none; border: 0; font: inherit; cursor: pointer; color: inherit; }
/* Календарь Кати.
   Тёплая «грушевая» палитра: сливочный фон, олива — действие, вино — сегодня и срочное.
   Unbounded только для заголовков и цифр, Onest для всего остального. Без украшений. */
:root {
  --cream: #FEFCF7;      /* фон: тёплый молочный, не холодный белый */
  --paper: #F4EEDF;      /* карточки чуть темнее фона */
  --olive: #867B18;      /* действие */
  --olive-ink: #4B4510;  /* текст на оливковом мягком */
  --olive-soft: #DED6AE;
  --wine: #8C2E3E;       /* сегодня, срочное, плюс */
  --wine-soft: #EBD3CF;
  --ink: #2E2A14;        /* основной текст — тёплый, не чёрный */
  --muted: #7A7358;
  --line: rgba(75, 69, 16, .14);
  --late: #8C2E3E; --soon: #4F6470; --azure: #E1E3D8; --lav: #E7E0CC; --pink: #DED6AE; --pink-deep: #8C2E3E; --gray: #7A7358;
  --display: 'Unbounded', 'Arial Black', sans-serif;
  --sans: 'Onest', -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
html, body { background: var(--cream); color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.tabular-nums { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 500; }
.title-mark { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-lg { width: 14px; height: 14px; }

/* заголовки вкладок */
.ptitle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 18px; }
.ptitle h1 { font-size: 30px; }
.subtitle { color: var(--muted); margin: -12px 0 18px; }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 2px 10px; }
.dayhead .eyebrow { font-family: var(--display); font-size: 15px; font-weight: 500; color: var(--ink); }
.dayhead-sum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* поверхности */
.paper { background: var(--paper); border-radius: 20px; }
.paper.divide-y > * + * { border-top: 1px solid var(--line); }
.paper > :first-child { border-top-left-radius: 20px; border-top-right-radius: 20px; }
.empty { background: var(--paper); border-radius: 20px; padding: 28px 20px; text-align: center; color: var(--muted); margin-bottom: 24px; }
.empty-title { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--ink); margin-bottom: 4px; }
.note { font-size: 14px; color: var(--olive-ink); background: var(--olive-soft); padding: 10px 14px; border-radius: 14px; }
.comment { background: var(--paper); border-radius: 14px; padding: 10px 14px; }

/* кнопки и поля */
.btn-primary { background: var(--olive); color: #FBF8EF; border-radius: 16px; font-weight: 600; font-size: 15px; }
.btn-primary:active { background: #6F6612; }
.btn-primary:disabled { opacity: .4; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; font-weight: 500; font-size: 15px; }
.mini-btn { font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 12px; color: var(--olive); background: var(--olive-soft); white-space: nowrap; }
.mini-btn:active { background: var(--olive); color: #FBF8EF; }
.link-danger { color: var(--wine); font-size: 14px; font-weight: 500; }
.input { width: 100%; background: var(--paper); border: 1px solid transparent; padding: 12px 14px; font-size: 16px; color: var(--ink); border-radius: 14px; outline: none; font-family: var(--sans); }
.input:focus { border-color: var(--olive); }
.input::placeholder { color: #A9A184; }
.segmented { display: flex; background: var(--paper); border-radius: 14px; padding: 4px; gap: 2px; }
.segmented button { flex: 1; padding: 8px 4px; font-size: 14px; font-weight: 500; color: var(--muted); border-radius: 10px; }
.segmented .seg-on { background: var(--olive); color: #FBF8EF; }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 12px; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid transparent; }
.chipbtn-on { border-color: var(--ink); }
.chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 8px; line-height: 1.4; }
.chip-late { color: var(--wine); background: var(--wine-soft); }
.chip-soon { color: var(--olive-ink); background: var(--olive-soft); }
.chip-calm { color: var(--muted); background: var(--cream); }
.caltag { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 8px; }
.caltag-shared { color: #F7F2E6; background: var(--soon); }
.checkbox { width: 24px; height: 24px; border: 1.5px solid var(--olive); border-radius: 50%; flex: none; position: relative; background: transparent; }
.checkbox-sm { width: 20px; height: 20px; }
.checkbox-on { background: var(--olive); }
.checkbox-on::after { content: ''; position: absolute; left: 36%; top: 20%; width: 28%; height: 45%; border: solid #FBF8EF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--olive-soft); position: relative; flex: none; transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); transition: transform .2s; }
.switch-on { background: var(--olive); } .switch-on span { transform: translateX(18px); }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--cream); }
.swatch-on { box-shadow: 0 0 0 2px var(--ink); }
.progress { height: 6px; background: var(--cream); border-radius: 3px; position: relative; overflow: hidden; }
.progress span { position: absolute; inset: 0 auto 0 0; background: var(--olive); border-radius: 3px; }

/* нижний лист */
.sheet-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(46, 42, 20, .35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 30rem; max-height: 92vh; overflow-y: auto; background: var(--cream); border-radius: 28px 28px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .26s ease-out; }
.sheet h2 { font-size: 24px !important; color: var(--ink) !important; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--olive-soft); margin: 0 auto 16px; }
.sheet .block > .eyebrow { margin-bottom: 6px; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* плюс и навигация */
.fab { position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 35; width: 60px; height: 60px; border-radius: 20px; background: var(--wine); color: #FBF8EF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px -8px rgba(140, 46, 62, .6); }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--cream); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.navbar > div { max-width: 30rem; margin: 0 auto; display: flex; }
.navbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; color: var(--muted); }
.navbtn-active { color: var(--olive); }
.navlabel { font-size: 11px; font-weight: 500; }

/* год */
.year-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--cream); margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); border-bottom: 1px solid var(--line); }
.year-bar { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; }
.year-big { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; }
.cal-wd { text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); padding: 2px 0 8px; }
.cal-we { color: var(--wine); opacity: .75; }
.month-block { padding-top: 30px; scroll-margin-top: 118px; }
.month-title { font-size: 38px; font-weight: 700; color: var(--olive); margin: 0 0 12px 2px; letter-spacing: -0.03em; }
.month-year { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 10px; letter-spacing: 0; }
.ycell { aspect-ratio: 1 / 1.08; display: flex; flex-direction: column; align-items: center; padding-top: 6px; color: var(--ink); min-width: 0; }
.ycell-num { font-size: 17px; font-weight: 500; line-height: 1; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; font-variant-numeric: tabular-nums; }
.ycell-we .ycell-num { color: var(--wine); }
.ycell-today .ycell-num { background: var(--wine); color: #FBF8EF; font-weight: 600; }
.ycell:active .ycell-num { background: var(--olive-soft); }
.cal-dots { display: flex; gap: 3px; height: 6px; margin-top: 4px; justify-content: center; }
.cal-dots .dot { width: 6px; height: 6px; }

/* день по часам */
.dayview { position: fixed; top: 0; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; background: var(--cream); z-index: 30; padding-top: env(safe-area-inset-top, 0px); }
.dayview-head { flex: none; border-bottom: 1px solid var(--line); }
.backlink { display: flex; align-items: center; gap: 2px; font-weight: 600; color: var(--olive); font-size: 15px; }
.dayview-title { font-size: 30px; padding: 12px 16px 14px; }
.dayview-title span { display: block; font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
.wstrip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 0; border-radius: 14px; color: var(--ink); }
.wstrip-wd { font-size: 11px; color: var(--muted); }
.wstrip-num { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wstrip-today .wstrip-num { color: var(--wine); }
.wstrip-on { background: var(--olive); } .wstrip-on .wstrip-num, .wstrip-on .wstrip-wd { color: #FBF8EF; }
.allday { color: #FBF8EF; font-size: 14px; font-weight: 500; padding: 5px 12px; border-radius: 10px; }
.daytask { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; padding: 5px 12px; border-radius: 10px; background: var(--paper); color: var(--ink); }
.daytask-done { text-decoration: line-through; color: var(--muted); }
.timeline-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.timeline { position: relative; margin-bottom: 96px; }
.hour { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); text-align: left; }
.hour-label { position: absolute; left: 12px; top: -9px; font-size: 12px; color: var(--muted); background: var(--cream); padding-right: 6px; font-variant-numeric: tabular-nums; }
.nowline { position: absolute; left: 50px; right: 0; height: 2px; background: var(--wine); z-index: 3; }
.nowline::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--wine); }
.evblock { position: absolute; z-index: 2; border-left: 4px solid; border-radius: 10px; padding: 5px 9px; text-align: left; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
.evblock-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.evblock-time { font-size: 12px; color: var(--muted); }

/* задачи */
.taskstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.taskstats > div { background: var(--paper); border-radius: 18px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.taskstats b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1; }
.taskstats span { font-size: 13px; color: var(--muted); }
.taskstats .is-late b { color: var(--wine); }
.taskcard { background: var(--paper); border-radius: 18px; padding: 14px 16px; }
.taskcard.is-done { background: transparent; border: 1px solid var(--line); }

/* неделя */
.weeknav { display: flex; gap: 6px; }
.weeknav button { width: 40px; height: 40px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; color: var(--ink); }
.weeknav button:disabled { opacity: .35; }
.weekhero { background: var(--olive); color: #FBF8EF; border-radius: 28px; padding: 22px 22px 18px; margin-bottom: 28px; }
.weekhero-main { display: flex; align-items: baseline; gap: 12px; }
.weekhero-main b { font-family: var(--display); font-weight: 700; font-size: 76px; line-height: .9; letter-spacing: -0.04em; }
.weekhero-main span { font-size: 17px; font-weight: 500; }
.weekhero-diff { margin: 10px 0 18px; color: #E9E3C3; font-size: 15px; }
.weekhero-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(251, 248, 239, .25); padding-top: 14px; }
.weekhero-stats div { display: flex; flex-direction: column; gap: 2px; }
.weekhero-stats b { font-family: var(--display); font-weight: 600; font-size: 20px; }
.weekhero-stats span { font-size: 13px; color: #E9E3C3; }
.catbar { height: 8px; background: var(--cream); border-radius: 4px; position: relative; overflow: hidden; }
.catbar span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
.daybar { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.daybar-col { height: 96px; width: 100%; max-width: 30px; display: flex; align-items: flex-end; background: var(--cream); border-radius: 9px; overflow: hidden; }
.daybar-col span { width: 100%; min-height: 3px; border-radius: 9px; }
.daybar-wd { font-size: 12px; color: var(--muted); }
.daybar-wd.is-today { color: var(--ink); font-weight: 600; }

/* заставка и вход */
.splash { position: fixed; inset: 0; z-index: 50; background: var(--olive); color: #FBF8EF; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); overflow-y: auto; }
.splash-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; animation: rise .9s ease-out both; }
.splash-title { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1.02; color: #FBF8EF; letter-spacing: -0.03em; }
.splash-date { font-size: 17px; color: #E9E3C3; }
.splash .logo-heart { color: #FBF8EF; }
.splash .topstrip, .splash .splash-stripes, .splash-stamp { display: none; }
.splash .eyebrow { color: #E9E3C3; }
.splash .input { background: #FBF8EF; }
.splash .note { background: #FBF8EF; }
.splash .btn-primary { background: var(--wine); }
.splash .segmented { background: rgba(251, 248, 239, .18); }
.splash .segmented button { color: #FBF8EF; }
.splash .segmented .seg-on { background: #FBF8EF; color: var(--olive-ink); }
.splash p, .splash .text-gray-500, .splash .text-gray-600 { color: #EFEAD2 !important; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
#boot { min-height: 100vh; background: var(--olive); color: #FBF8EF; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* заставка-приветствие: текст слева внизу, «небо» меняется по времени суток */
.hello { position: fixed; inset: 0; z-index: 50; background: var(--olive); color: #FBF8EF; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; padding: calc(28px + env(safe-area-inset-top, 0px)) 26px calc(40px + env(safe-area-inset-bottom, 0px)); }
.hello-date { position: relative; font-size: 17px; line-height: 1.35; color: #E9E3C3; margin: 0; }
.hello-text { position: relative; display: flex; flex-direction: column; font-family: var(--display); font-weight: 700; font-size: clamp(34px, 9.5vw, 60px); line-height: 1; letter-spacing: -0.035em; color: #FBF8EF; text-align: left; }
.hello-text span { display: block; animation: hello-in .7s cubic-bezier(.2, .7, .2, 1) both; }
.hello-text span:nth-child(2) { animation-delay: .08s; }
.hello-text span:nth-child(3) { animation-delay: .16s; color: #F2DCD6; }
@keyframes hello-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.hello-sky { position: absolute; inset: 0; pointer-events: none; }
.hello-sky span { position: absolute; border-radius: 50%; }
/* утро — низкое солнце справа */
.hello-morning .hello-sky span { width: 62vmax; height: 62vmax; right: -24vmax; top: 18%; background: #A1962E; }
/* день — большое солнце высоко */
.hello-day .hello-sky span { width: 78vmax; height: 78vmax; right: -30vmax; top: -34vmax; background: #9A8F27; }
/* вечер — винное солнце садится за край */
.hello-evening { background: #6F6612; }
.hello-evening .hello-sky span { width: 70vmax; height: 70vmax; right: -28vmax; top: 30%; background: var(--wine); }
/* ночь — тонкий месяц */
.hello-night { background: #3F3A0D; }
.hello-night .hello-sky span { width: 40vmax; height: 40vmax; right: -14vmax; top: 14%; background: transparent; box-shadow: -7vmax 4vmax 0 0 #E9E3C3; }

.hello-evening .hello-text span:nth-child(3) { color: #FBF8EF; }

/* Бизнес-учёт: поверх общей темы. Палитра — в переменных ниже (меняется в одном месте). */
:root {
  /* кофе + сливки + небо (по референсам dorada / MURU) */
  --cream: #F6F1E7; --paper: #EDE3D1; --ink: #3A2116; --muted: #8A7364; --line: rgba(58, 33, 22, .12);
  --coffee: #4A2A1C; --butter: #F1DFAF; --sky: #BFD0E4;
  --olive: #4A2A1C; --olive-ink: #4A2A1C; --olive-soft: #F1DFAF;   /* основное действие — кофе */
  --wine: #4A2A1C; --wine-soft: #F1DFAF;
  --in: #3A659A; --in-soft: #CFDCEC;     /* поступления — небо */
  --out: #8B4A26; --out-soft: #F1DFAF;   /* расходы — кофе со сливками */
  --warn: #9A6A12; --warn-soft: #F5E8C6;
  --display: 'Dela Gothic One', 'Arial Black', sans-serif;
  --sans: 'Manrope', -apple-system, 'Segoe UI', Roboto, sans-serif;
}
h1, h2, h3, .display { font-weight: 400; letter-spacing: -0.01em; }
.ptitle h1 { font-size: 30px; color: var(--coffee); }
.page { max-width: 30rem; margin: 0 auto; padding: 0 16px 120px; }
.ptitle { padding: 20px 0 16px; }
.ptitle h1 { font-size: 28px; }
.subtitle { margin: -6px 0 18px; font-size: 14px; }
.txt-in { color: var(--in); } .txt-out { color: var(--out); }
.neg { color: var(--out); }
.input-big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.input-sm { width: auto; padding: 8px 10px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn-on { border-color: var(--ink); background: var(--cream); }

.monthnav { display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.monthnav button { padding: 6px; color: var(--muted); }

.ledger-head { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ledger-head > div { border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.ledger-head b { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.col-in { background: var(--in-soft); } .col-in b { color: var(--in); }
.col-out { background: var(--out-soft); } .col-out b { color: var(--out); }
.profit { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 4px 0; font-size: 15px; color: var(--muted); }
.profit b { font-size: 18px; color: var(--ink); }

.cardtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cardtile { background: var(--paper); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; }
.cardtile-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
